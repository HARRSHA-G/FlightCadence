{% load ui %}
<div class="abt-value premium-card" style="padding:1.5rem;">
    <div style="width:2.5rem;height:2.5rem;border-radius:0.625rem;background:rgba(255,59,48,0.1);color:var(--primary-red);display:flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:1rem">
        {% icon icon_name 20 %}
    </div>
    <h4 style="font-size:0.9375rem;font-weight:800;color:var(--text-dark);margin:0 0 0.5rem">{{ title }}</h4>
    <p style="color:var(--text-muted);font-size:0.8125rem;line-height:1.6;margin:0">{{ desc }}</p>
</div>
