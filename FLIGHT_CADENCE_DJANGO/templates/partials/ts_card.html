{% load ui %}
<div class="ts-card premium-card" style="padding:1.75rem;">
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;">
        <div style="width:2.5rem;height:2.5rem;border-radius:0.625rem;background:rgba(255,59,48,0.1);color:var(--primary-red);display:flex;align-items:center;justify-content:center;font-size:1.25rem">
            {% icon icon_name 20 %}
        </div>
        <h3 style="font-size:1.125rem;font-weight:800;color:var(--text-dark);margin:0">{{ title }}</h3>
    </div>
    <ul style="color:var(--text-muted);font-size:0.875rem;line-height:1.7;display:grid;gap:0.5rem;margin:0;padding:0;list-style:none">
        {% for item in items %}
        <li style="display:flex;align-items:flex-start;gap:0.5rem">
            <span style="color:var(--primary-red);font-size:0.75rem;line-height:1.5">✓</span>
            <span>{{ item }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
