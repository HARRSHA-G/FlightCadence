{% extends "app_base.html" %}

{% block title %}NOTAMs | FLIGHT CADENCE{% endblock %}

{% block content %}
<div class="fade-in">
    <div style="margin-bottom:1.875rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;">
        <div>
            <h2 style="font-size:1.5rem;font-weight:900;color:var(--text-dark);margin-bottom:0.5rem;">
                NOTAMs Management
            </h2>
            <p style="color:var(--dash-muted);margin:0;font-size:0.875rem;">
                Archive and review Notices to Airmen for your active routes.
            </p>
        </div>
        <div>
            <input type="file" id="notamFileInput" accept="application/pdf" multiple style="display:none;" onchange="notamsApp.handleUpload(event)">
            <button class="btn-primary" onclick="document.getElementById('notamFileInput').click()" style="display:flex;align-items:center;gap:0.5rem;padding:0.625rem 1.25rem;font-size:0.8125rem;">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
                Upload NOTAM PDF
            </button>
        </div>
    </div>

    <!-- Date Tabs -->
    <div class="notams-tabs" id="notamsTabs"></div>

    <!-- Active Tab Files List -->
    <div style="background-color:var(--dash-card-bg);border:var(--dash-border);border-radius:0.75rem;padding:1.5rem;box-shadow:var(--dash-shadow-soft);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:0.0625rem solid var(--dash-divider);">
            <div style="display:flex;align-items:center;gap:0.5rem;font-weight:900;color:var(--text-dark);">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary-red)"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                <span id="activeTabTitle">Today's NOTAMs</span>
            </div>
            <div style="font-size:0.75rem;color:var(--dash-muted);" id="activeTabCount">0 documents</div>
        </div>

        <div id="notamsListContainer" style="display:flex;flex-direction:column;gap:0.75rem;"></div>
    </div>
</div>

<script>
const notamsApp = (() => {
    const STORAGE_KEY = "flight_cadence_notams_data";

    function getOffsetDate(offset) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    const tabs = [
        { id: "yesterday", label: "Yesterday", date: getOffsetDate(-1) },
        { id: "today", label: "Today", date: getOffsetDate(0) },
        { id: "tomorrow", label: "Tomorrow", date: getOffsetDate(1) },
    ];

    let activeTabId = "today";

    function loadPdfs() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            return {};
        }
    }

    function savePdfs(data) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            alert("Storage limit reached. Please remove older NOTAM PDFs.");
        }
    }

    function renderTabs() {
        const wrap = document.getElementById("notamsTabs");
        wrap.innerHTML = tabs.map(t => `
            <button 
                type="button" 
                class="tab ${t.id === activeTabId ? 'active' : ''}" 
                onclick="notamsApp.switchTab('${t.id}')"
            >
                ${t.label} &bull; ${t.date}
            </button>
        `).join("");
    }

    function renderList() {
        const curTab = tabs.find(t => t.id === activeTabId);
        const data = loadPdfs();
        const list = data[curTab.date] || [];

        document.getElementById("activeTabTitle").textContent = `${curTab.label} (${curTab.date})`;
        document.getElementById("activeTabCount").textContent = `${list.length} document${list.length === 1 ? '' : 's'}`;

        const container = document.getElementById("notamsListContainer");
        if (list.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:3.5rem 1rem;color:var(--dash-muted);">
                    <svg class="icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1rem;color:var(--dash-muted);opacity:0.6;"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                    <p style="font-size:1rem;font-weight:700;margin:0 0 0.25rem;color:var(--text-dark);">No NOTAMs Uploaded</p>
                    <p style="font-size:0.875rem;margin:0;">Click "Upload NOTAM PDF" to add briefing bulletins for ${curTab.date}.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = list.map(item => `
            <div style="display:flex;align-items:center;padding:1rem 1.25rem;background-color:var(--dash-input-bg);border:var(--dash-border);border-radius:0.5rem;gap:1rem;flex-wrap:wrap;">
                <div style="width:2.5rem;height:2.5rem;border-radius:0.5rem;background:rgba(255,59,48,0.1);display:flex;align-items:center;justify-content:center;color:var(--primary-red);flex-shrink:0;">
                    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <div style="flex:1;min-width:12rem;">
                    <div style="font-weight:700;color:var(--text-dark);font-size:0.9375rem;word-break:break-all;">${item.name}</div>
                    <div style="font-size:0.75rem;color:var(--dash-muted);margin-top:0.125rem;">${item.size} &bull; PDF Briefing</div>
                </div>
                <div style="display:flex;gap:0.5rem;align-items:center;">
                    <button 
                        type="button" 
                        class="btn-dark" 
                        style="padding:0.4375rem 0.75rem;font-size:0.75rem;display:flex;align-items:center;gap:0.375rem;" 
                        onclick="notamsApp.openPdf('${item.id}')"
                    >
                        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        View
                    </button>
                    <button 
                        type="button" 
                        class="btn-dark" 
                        style="padding:0.4375rem 0.75rem;font-size:0.75rem;display:flex;align-items:center;gap:0.375rem;" 
                        onclick="notamsApp.downloadPdf('${item.id}')"
                    >
                        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download
                    </button>
                    <button 
                        type="button" 
                        style="background:transparent;border:1px solid var(--primary-red);color:var(--primary-red);padding:0.4375rem 0.75rem;font-size:0.75rem;border-radius:0.375rem;display:flex;align-items:center;gap:0.375rem;cursor:pointer;" 
                        onclick="notamsApp.removePdf('${item.id}')"
                    >
                        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>
        `).join("");
    }

    function switchTab(tabId) {
        activeTabId = tabId;
        renderTabs();
        renderList();
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function handleUpload(e) {
        const files = Array.from(e.target.files);
        const validPdfs = files.filter(f => f.type === "application/pdf" || f.name.endsWith(".pdf"));
        if (validPdfs.length < files.length) {
            alert("Only PDF files are allowed.");
        }
        if (validPdfs.length === 0) return;

        const curDate = tabs.find(t => t.id === activeTabId).date;
        const data = loadPdfs();

        try {
            const newItems = await Promise.all(validPdfs.map(async (file) => {
                const base64Url = await fileToBase64(file);
                return {
                    id: Math.random().toString(36).substring(2, 11),
                    name: file.name,
                    size: (file.size / 1024).toFixed(2) + " KB",
                    url: base64Url
                };
            }));

            data[curDate] = [...(data[curDate] || []), ...newItems];
            savePdfs(data);
            renderList();
        } catch (err) {
            alert("Error processing PDF files.");
        }
        e.target.value = "";
    }

    function removePdf(id) {
        const curDate = tabs.find(t => t.id === activeTabId).date;
        const data = loadPdfs();
        data[curDate] = (data[curDate] || []).filter(item => item.id !== id);
        savePdfs(data);
        renderList();
    }

    function openPdf(id) {
        const curDate = tabs.find(t => t.id === activeTabId).date;
        const data = loadPdfs();
        const item = (data[curDate] || []).find(it => it.id === id);
        if (item && item.url) {
            const win = window.open();
            win.document.write(`<iframe src="${item.url}" style="width:100%;height:100vh;border:none;margin:0;padding:0;"></iframe>`);
        }
    }

    function downloadPdf(id) {
        const curDate = tabs.find(t => t.id === activeTabId).date;
        const data = loadPdfs();
        const item = (data[curDate] || []).find(it => it.id === id);
        if (item && item.url) {
            const link = document.createElement("a");
            link.href = item.url;
            link.download = item.name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    return { switchTab, handleUpload, removePdf, openPdf, downloadPdf, init: () => { renderTabs(); renderList(); } };
})();

document.addEventListener("DOMContentLoaded", () => notamsApp.init());
</script>
{% endblock %}
