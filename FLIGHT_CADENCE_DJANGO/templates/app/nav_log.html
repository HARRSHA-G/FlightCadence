{% extends "app_base.html" %}

{% block title %}Nav Log | FLIGHT CADENCE{% endblock %}

{% block content %}
<div class="fade-in" style="height:100%;min-height:calc(100vh - 120px);display:flex;justify-content:center;align-items:center;">
    <div style="background-color:var(--dash-card-bg);border:var(--dash-border);border-radius:1rem;padding:3rem;box-shadow:var(--dash-shadow-soft);text-align:center;max-width:400px;width:100%;">
        <svg class="icon icon-map" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:1.25rem;color:var(--primary-red)"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" x2="9" y1="3" y2="18"></line><line x1="15" x2="15" y1="6" y2="21"></line></svg>
        <h2 style="font-size:1.5rem;font-weight:900;color:var(--text-dark);margin-bottom:1rem;">
            ForeFlight Navigation
        </h2>
        <p style="color:var(--dash-muted);margin-bottom:2rem;font-size:0.875rem;line-height:1.5;">
            Access ForeFlight for advanced Navigation Logs, PLOGs, and flight performance metrics.
        </p>
        <button 
            type="button"
            class="btn-primary" 
            style="padding:0.75rem 1.5rem;width:100%;display:flex;justify-content:center;align-items:center;gap:0.5rem;"
            onclick="window.open('https://foreflight.com/', '_blank')"
        >
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Open ForeFlight
        </button>
    </div>
</div>
{% endblock %}
